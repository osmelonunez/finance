services:
  finance:
    image: f1nanc3/finance:3.8.0
    container_name: finance
    ports:
      - "5000:5000"
    environment:
      # Runtime mode (development/production).
      APP_ENV: production
      # Text logs with ANSI colors by level: info=green, warning=yellow, error=red.
      LOG_FORMAT: text
      LOG_COLOR: "true"
      # Single source of truth for the database connection (required).
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Directory used to store generated backup files.
      BACKUP_DIR: /backups
      BACKUP_CRON_ENABLED: "true"
      TZ: Europe/Madrid
      # User session lifetime in hours.
      SESSION_LIFETIME_HOURS: "12"
      # Flask session signing secret (required in production).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      # SMTP delivery is configured entirely through environment variables.
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Finance}
      # Public app URL used in email links.
      APP_PUBLIC_URL: "https://finance.home"
      # In-memory limiter backend (sufficient for single-instance domestic use).
      RATELIMIT_STORAGE_URI: "memory://"
      # Rate limits for auth endpoints.
      RATE_LIMIT_LOGIN_IP: "10 per minute;60 per hour"
      RATE_LIMIT_LOGIN_ID: "5 per minute;30 per hour"
      RATE_LIMIT_REGISTER_IP: "5 per 10 minutes;20 per hour"
      RATE_LIMIT_PASSWORD_CHANGE: "5 per 15 minutes"
      # Ajuste ligero para Raspberry (1-2 usuarios concurrentes).
      # workers = procesos, threads = hilos por proceso.
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "2"
      GUNICORN_TIMEOUT: "120"
    volumes:
      - ./backups:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    restart: unless-stopped
